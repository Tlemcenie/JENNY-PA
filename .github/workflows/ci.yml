# CI — lint, format, types, tests (sur chaque push et PR)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/ ml/ nanogpt/ pipelines/

      - name: Ruff format (check)
        run: ruff format --check src/ tests/ ml/ nanogpt/ pipelines/

      - name: Mypy (application)
        run: mypy src/jenny/

      - name: Pytest
        run: pytest tests/ -q --tb=short
