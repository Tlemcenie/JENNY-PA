# CI — lint + migrations Postgres réelles + tests avec couverture
name: CI

on:
  push:
    branches: [main, master, wip/jenny-build]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # modèle RAG par défaut
  HF_MODEL: paraphrase-multilingual-mpnet-base-v2

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # même ruff que pyproject
      - name: Installer ruff
        run: |
          RUFF_SPEC=$(python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print(next(r for r in d['project']['optional-dependencies']['dev'] if r.startswith('ruff')))")
          echo "ruff: $RUFF_SPEC"
          python -m pip install "$RUFF_SPEC"

      - name: Ruff lint
        run: ruff check --output-format=github src/ tests/ ml/ nanogpt/ pipelines/

      # 100 fichiers à formater : informatif
      - name: Ruff format (informatif)
        continue-on-error: true
        run: ruff format --check src/ tests/ ml/ nanogpt/ pipelines/

  tests:
    name: Migrations + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jenny
          POSTGRES_PASSWORD: jenny_secret
          POSTGRES_DB: jenny
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jenny -d jenny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PG_URL: postgresql+asyncpg://jenny:jenny_secret@localhost:5432/jenny
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # torch CPU : pas de CUDA
      - name: Installer (torch CPU + .[dev])
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3.0"
          pip install -e ".[dev]"

      - name: Cache modèle HF
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ env.HF_MODEL }}-v1

      - name: Télécharger le modèle RAG
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: python -c "from sentence_transformers import SentenceTransformer as S; S('${{ env.HF_MODEL }}')"

      - name: Sauver le cache HF
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

      - name: Alembic upgrade head
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: alembic upgrade head

      - name: Alembic aller-retour (dernière migration)
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic downgrade -1
          alembic upgrade head

      # bug connu : initial_schema
      - name: Alembic downgrade base (informatif)
        continue-on-error: true
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: alembic downgrade base

      # head quoi qu'il arrive
      - name: Alembic remet head
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic current

      - name: Alembic check (informatif)
        continue-on-error: true
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: alembic check

      - name: Pytest + couverture
        env:
          HF_HUB_OFFLINE: "1"
          JENNY_TEST_POSTGRES_URL: ${{ env.PG_URL }}
          JENNY_TEST_REDIS_URL: ${{ env.REDIS_URL }}
        run: >-
          pytest tests/ -q --tb=short -rfEs --durations=15
          --cov --cov-report=term:skip-covered --cov-report=xml

      - name: Résumé couverture
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Couverture" >> "$GITHUB_STEP_SUMMARY"
            coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      # 395 erreurs strict : informatif
      - name: Mypy (informatif)
        continue-on-error: true
        run: mypy src/jenny/
