# CI — lint + migrations Postgres réelles + tests (réseau coupé) + front + images
name: CI

on:
  push:
    branches: [main, master, wip/jenny-build, "integration/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # modèle RAG + tête d'intention
  HF_MODEL: paraphrase-multilingual-mpnet-base-v2

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # même ruff que pyproject
      - name: Installer ruff
        run: |
          RUFF_SPEC=$(python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print(next(r for r in d['project']['optional-dependencies']['dev'] if r.startswith('ruff')))")
          echo "ruff: $RUFF_SPEC"
          python -m pip install "$RUFF_SPEC"

      - name: Ruff lint
        run: ruff check --output-format=github src/ tests/ ml/ nanogpt/ pipelines/

      # 100 fichiers à formater : informatif
      - name: Ruff format (informatif)
        continue-on-error: true
        run: ruff format --check src/ tests/ ml/ nanogpt/ pipelines/

  tests:
    name: Migrations + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jenny
          POSTGRES_PASSWORD: jenny_secret
          POSTGRES_DB: jenny
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jenny -d jenny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # base vierge du service
      PG_URL: postgresql+asyncpg://jenny:jenny_secret@localhost:5432/jenny
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # torch CPU : pas de CUDA
      - name: Installer (torch CPU + .[dev])
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3.0"
          pip install -e ".[dev]"

      - name: Cache modèle HF
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ env.HF_MODEL }}-v1

      # seul accès réseau HF du job
      - name: Télécharger le modèle RAG
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: python -c "from sentence_transformers import SentenceTransformer as S; S('${{ env.HF_MODEL }}')"

      - name: Sauver le cache HF
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

      - name: Alembic upgrade head (base vierge)
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: alembic upgrade head

      - name: Alembic aller-retour (dernière migration)
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic downgrade -1
          alembic upgrade head

      # toute la chaîne se défait
      - name: Alembic downgrade base
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: alembic downgrade base

      # puis se refait
      - name: Alembic remet head
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic current

      # zéro dérive modèles / base
      - name: Alembic check
        env:
          JENNY_DATABASE_URL: ${{ env.PG_URL }}
        run: alembic check

      # réseau sortant coupé par tests/conftest.py
      - name: Pytest + couverture
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          JENNY_TEST_POSTGRES_URL: ${{ env.PG_URL }}
          JENNY_TEST_REDIS_URL: ${{ env.REDIS_URL }}
        run: >-
          pytest tests/ -q --tb=short -rfEs --durations=15
          --cov --cov-report=term:skip-covered --cov-report=xml

      - name: Résumé couverture
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Couverture" >> "$GITHUB_STEP_SUMMARY"
            coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      # 395 erreurs strict : informatif
      - name: Mypy (informatif)
        continue-on-error: true
        run: mypy src/jenny/

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # 17 erreurs connues : informatif
      - name: ESLint (informatif)
        continue-on-error: true
        run: npx eslint

      - name: Build Next
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://api.example.test
          NEXT_PUBLIC_SITE_URL: https://app.example.test
        run: npx next build --webpack

  images:
    name: Images Docker (build seul)
    # lourd : pas sur chaque PR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image API (prod)
        run: docker build -f docker/api.prod.Dockerfile -t jenny-api:ci .

      # mpnet dans l'image, hors ligne
      - name: API sans réseau
        run: >-
          docker run --rm --network none --entrypoint python jenny-api:ci -c
          "from jenny.rag.embeddings import get_default_embedder as g;
          import asyncio; v = asyncio.run(g().embed_text('bonjour')); assert len(v) == 768; print('ok', len(v))"

      - name: Image worker
        run: docker build -f docker/worker.Dockerfile -t jenny-worker:ci .

      - name: Image frontend
        run: >-
          docker build -f frontend/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.test
          --build-arg NEXT_PUBLIC_SITE_URL=https://app.example.test
          -t jenny-frontend:ci frontend
