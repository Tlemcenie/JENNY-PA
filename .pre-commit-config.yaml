# Hooks locaux — après `pip install -e ".[dev]"` : pre-commit install
# rev = version ruff du pyproject (vérifié par tests/unit/test_ci_dependencies.py)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
