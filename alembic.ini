# ──────────────────────────────────────────────
# Alembic Configuration
# ──────────────────────────────────────────────
[alembic]
script_location = migrations
prepend_sys_path = src

# La DB URL est surchargée dans migrations/env.py via les settings
sqlalchemy.url = postgresql+asyncpg://jenny:jenny_secret@localhost:5432/jenny

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
