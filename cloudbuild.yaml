# Cloud Build — construit et pousse les 3 images Jenny vers Artifact Registry.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_REPO=jenny,_API_URL=https://jenny-api-xxxx.run.app
#
# _API_URL est l'URL publique de l'API (inlinée au build du frontend).

substitutions:
  _REGION: europe-west1
  _REPO: jenny
  _API_URL: https://CHANGE-ME.run.app

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/worker:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest"

steps:
  # ── API (image PROD optimisée : torch CPU, $PORT, non-root) ──
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/api.prod.Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"
      - .

  # ── Worker (cron ARQ) ──
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/worker.Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/worker:latest"
      - .

  # ── Frontend (Next standalone ; l'URL API est inlinée au build) ──
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - "NEXT_PUBLIC_API_URL=${_API_URL}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest"
      - frontend

options:
  machineType: E2_HIGHCPU_8  # torch + build Next : un peu de CPU aide.
timeout: 2400s
