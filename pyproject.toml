[project]
name = "jenny"
version = "0.1.0"
description = "Jenny — AI-powered customer message management platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jenny Team" }]

dependencies = [
    # ── API ──
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic[email]>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    # ── Database ──
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    # ── Cache & Broker ──
    "redis>=5.2,<6.0",
    "arq>=0.26,<1.0",
    # ── AI / Agents ──
    # NB : pas de LangChain/LangGraph. L'orchestration agentique est maison
    # (jenny.engine.conversation_engine + jenny.agents.*). Les LLM passent par
    # jenny.llm.providers (Groq/Ollama/NanoGPT en httpx/torch directs).
    # ── Documents (devis PDF) ──
    "reportlab>=4.0,<5.0",
    # ── ML (inférence) ──
    # entraînement : extra [ml]
    "torch>=2.5,<3.0",
    "tokenizers>=0.21,<1.0",
    # ── Observability ──
    "structlog>=24.4,<25.0",
    # ── Utils ──
    "langdetect>=1.0.9,<2.0",
    "email-validator>=2.2,<3.0",
    "PyJWT>=2.9,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "stripe>=11.0,<17.0",
    "prometheus-client>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
    # chiffre les identifiants canal
    "cryptography>=42,<47",
    # fuseaux sans tzdata système
    "tzdata>=2024.1",
    # ── RAG ──
    "sentence-transformers>=5.6.0",
    # ── Tête d'intention (ml/models/intent_head) ──
    # importés à l'inférence
    "numpy>=1.26,<3.0",
    # relit head.joblib
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
# entraînement de la tête
ml = [
    # (déjà tirés par sentence-transformers)
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.11,<2.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-timeout>=2.3,<3.0",
    "httpx>=0.28,<1.0",
    "aiosqlite>=0.20,<1.0",
    # même version que pre-commit
    "ruff==0.15.16",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jenny*"]

[tool.setuptools.package-dir]
"" = "src"

# ── Ruff (lint + format) ──
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jenny"]

# ── Mypy ──
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*"]
ignore_missing_imports = true

# ── Pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
pythonpath = ["src", "."]
# 120 s max par test
timeout = 120

# ── Couverture ──
[tool.coverage.run]
source_pkgs = ["jenny"]
omit = ["*/jenny/scripts/*"]

[tool.coverage.report]
skip_empty = true
precision = 1
